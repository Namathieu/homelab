services:
  ei-bot:
    build: .
    container_name: ${EI_BOT_CONTAINER_NAME:-ei-bot}
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
      - ./backups:/app/backups

  ei-web:
    build: .
    container_name: ${EI_WEB_CONTAINER_NAME:-ei-web}
    restart: unless-stopped
    env_file:
      - .env
    command: flask --app app.web run --host 0.0.0.0 --port 8080
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
      - ./backups:/app/backups
