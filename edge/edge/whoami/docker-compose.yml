services:
  whoami:
    image: traefik/whoami:latest
    container_name: whoami
    restart: unless-stopped

    networks:
      - proxy

    labels:
      - traefik.enable=true

      # Router
      - traefik.http.routers.whoami.rule=Host(`whoami.edge.home.lab`)
      - traefik.http.routers.whoami.entrypoints=web

      # (optional but nice) security headers from file provider
      - traefik.http.routers.whoami.middlewares=security-headers@file

networks:
  proxy:
    external: true
