services:
  plex:
    image: linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=1000
      - PGID=2000
      - TZ=America/Montreal
      - VERSION=docker
      - UMASK=002
    volumes:
      - /home/nama/config/plex:/config
      - /mnt/data/streaming/media:/data/media
    restart: unless-stopped

  overseerr:
    image: sctx/overseerr:latest
    container_name: overseerr
    environment:
      - LOG_LEVEL=info
      - TZ=America/Montreal
    ports:
      - 5055:5055
    volumes:
      - /home/nama/config/overseerr:/app/config
    restart: unless-stopped

  jackett:
    image: linuxserver/jackett:latest
    container_name: jackett
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - PUID=1000
      - PGID=2000
      - TZ=America/Montreal
      - AUTO_UPDATE=true
      - UMASK=002
    volumes:
      - /home/nama/config/jackett:/config
      - /mnt/data/streaming:/data
    ports:
      - 9117:9117
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=America/Montreal
    ports:
      - 8191:8191
    restart: unless-stopped

  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - PUID=1000
      - PGID=2000
      - TZ=America/Montreal
      - UMASK=002
    volumes:
      - /home/nama/config/radarr:/config
      - /mnt/data/streaming:/data
    ports:
      - 7878:7878
    restart: unless-stopped

  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - PUID=1000
      - PGID=2000
      - TZ=America/Montreal
      - UMASK=002
    volumes:
      - /home/nama/config/sonarr:/config
      - /mnt/data/streaming:/data
    ports:
      - 8989:8989
    restart: unless-stopped

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8080:8080
      - 6881:6881/tcp
      - 6881:6881/udp
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${OPENVPN_USERNAME}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_REGIONS=Bahamas
      - TZ=America/Montreal
      - FIREWALL=on
      - DOT=off
      - LOCAL_NETWORK=192.168.2.0/24
      - UPDATER_PERIOD=24h
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:gluetun
    environment:
      - PUID=1000
      - PGID=2000
      - TZ=America/Montreal
      - WEBUI_PORT=8080
      - UMASK=002
    volumes:
      - /home/nama/config/qbittorrent:/config
      - /mnt/data/streaming:/data
    restart: unless-stopped
